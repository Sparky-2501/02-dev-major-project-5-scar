services:
  # Upstream NGINX Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: scar_load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_node1
      - api_node2
      - frontend

  # Backend Horizontal Scaling Node 1
  api_node1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scar_api_node_1
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"

  # Backend Horizontal Scaling Node 2
  api_node2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scar_api_node_2
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"

  # Production Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scar_frontend_web
    expose:
      - "80"
