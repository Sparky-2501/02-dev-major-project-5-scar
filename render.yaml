services:
  # -------------------------------------------------------------
  # 1. SCAR Backend Express API Web Service
  # -------------------------------------------------------------
  - type: web
    name: scar-backend-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Paste your MongoDB Atlas URI here
      - key: FRONTEND_URL
        sync: false # Paste your deployed Frontend Render URL here
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # -------------------------------------------------------------
  # 2. SCAR Frontend React Single Page Application (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: scar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://scar-backend-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
